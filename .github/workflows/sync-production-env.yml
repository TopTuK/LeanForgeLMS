name: Manual sync production .env

# Renders the production `.env` from GitHub Actions secrets/variables and ships it to the
# PROD server, next to docker-compose.production.yml. GitHub is the source of truth — the
# file on the server is overwritten every run (the previous one is backed up first).
#
# This workflow does NOT restart or redeploy anything. The new values take effect on the
# next "Manual deploy production" run or a manual `docker compose up -d` on the box.

on: workflow_dispatch

jobs:
  sync-env:
    name: Recreate .env on PROD
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SSH_KEY_PATH: /tmp/ssh_key
      SSH_PORT: 45654
      DEPLOY_DIR: /home/toptuk/leanforgelms/
      COMPOSE_FILE: docker-compose.production.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deploy secrets
        run: |
          if [ -z "${{ secrets.PRODUCTION_SSH_USERNAME }}" ]; then
            echo "::error::PRODUCTION_SSH_USERNAME secret is not set or empty (this causes 'runner@host' and Permission denied)"
            exit 1
          fi
          if [ -z "${{ secrets.PRODUCTION_SSH_HOST }}" ]; then
            echo "::error::PRODUCTION_SSH_HOST secret is not set or empty"
            exit 1
          fi
          if [ -z "${{ secrets.PRODUCTION_SSH_KEY }}" ]; then
            echo "::error::PRODUCTION_SSH_KEY secret is not set or empty"
            exit 1
          fi

      - name: Render .env
        env:
          # --- required secrets (job fails if unset/empty) ---
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          DefaultAuth__JwtKey: ${{ secrets.DefaultAuth__JwtKey }}
          PmiAuth__ClientId: ${{ secrets.PmiAuth__ClientId }}
          PmiAuth__ClientSecret: ${{ secrets.PmiAuth__ClientSecret }}
          PmiAuth__OpenIdConfigurationUrl: ${{ secrets.PmiAuth__OpenIdConfigurationUrl }}
          GoogleAuth__ClientId: ${{ secrets.GoogleAuth__ClientId }}
          GoogleAuth__ClientSecret: ${{ secrets.GoogleAuth__ClientSecret }}
          YandexAuth__ClientId: ${{ secrets.YandexAuth__ClientId }}
          YandexAuth__ClientSecret: ${{ secrets.YandexAuth__ClientSecret }}
          Robokassa__MerchantLogin: ${{ secrets.Robokassa__MerchantLogin }}
          Robokassa__Password1: ${{ secrets.Robokassa__Password1 }}
          Robokassa__Password2: ${{ secrets.Robokassa__Password2 }}
          # --- optional secrets (blank allowed) ---
          Unleash__ApiKey: ${{ secrets.Unleash__ApiKey }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # --- non-secret config: repository Variables, each with a fallback default ---
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'leanforge' }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'leanforge' }}
          WEBAPI_VIRTUAL_HOST: ${{ vars.WEBAPI_VIRTUAL_HOST || 'lms.s-sidorov.ru' }}
          WEBAPI_HOST_PORT: ${{ vars.WEBAPI_HOST_PORT || '8085' }}
          UNLEASH_API_URL: ${{ vars.UNLEASH_API_URL || 'https://features.s-sidorov.ru/api/' }}
          Robokassa__HashAlgorithm: ${{ vars.Robokassa__HashAlgorithm || 'SHA256' }}
          Robokassa__IsTest: ${{ vars.Robokassa__IsTest || 'false' }}
          Robokassa__SuccessUrl: ${{ vars.Robokassa__SuccessUrl || 'https://lms.s-sidorov.ru/payments/success' }}
          Robokassa__FailUrl: ${{ vars.Robokassa__FailUrl || 'https://lms.s-sidorov.ru/payments/fail' }}
        run: |
          set -euo pipefail
          umask 077

          # Emit "NAME=value". `req` fails the job when the value is empty; `opt` allows it.
          # Values are read via bash indirect expansion so secret contents never appear as
          # literal `${{ }}` text in the workflow file or the run log.
          # Note: the brace group below redirects stdout to the rendered file, so the
          # error message and annotation go to stderr to stay visible in the step log.
          req() {
            local value="${!1-}"
            if [ -z "$value" ]; then
              echo "::error::required secret/variable $1 is not set or empty" >&2
              exit 1
            fi
            printf '%s=%s\n' "$1" "$value"
          }
          opt() { printf '%s=%s\n' "$1" "${!1-}"; }

          {
            echo "# Generated by .github/workflows/sync-production-env.yml at $(date -u +%FT%TZ)"
            echo "# Source of truth: GitHub Actions secrets/variables. Do not hand-edit."
            echo ""
            req POSTGRES_USER
            req POSTGRES_PASSWORD
            req POSTGRES_DB
            opt WEBAPI_HOST_PORT
            echo ""
            req MINIO_ROOT_USER
            req MINIO_ROOT_PASSWORD
            echo ""
            req DefaultAuth__JwtKey
            req PmiAuth__ClientId
            req PmiAuth__ClientSecret
            req PmiAuth__OpenIdConfigurationUrl
            req GoogleAuth__ClientId
            req GoogleAuth__ClientSecret
            req YandexAuth__ClientId
            req YandexAuth__ClientSecret
            echo ""
            req Robokassa__MerchantLogin
            req Robokassa__Password1
            req Robokassa__Password2
            req Robokassa__HashAlgorithm
            req Robokassa__IsTest
            req Robokassa__SuccessUrl
            req Robokassa__FailUrl
            echo ""
            opt SENTRY_DSN
            echo ""
            req WEBAPI_VIRTUAL_HOST
            req UNLEASH_API_URL
            opt Unleash__ApiKey
          } > .env.rendered.tmp

          # Strip any stray CR so `docker compose` sees clean values, then finalize.
          sed 's/\r$//' .env.rendered.tmp > .env.rendered
          rm -f .env.rendered.tmp

          echo "Rendered .env with $(grep -c '=' .env.rendered) entries"

      - name: Setup SSH key
        run: |
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY }}" | sed 's/\r$//' > ${{ env.SSH_KEY_PATH }}
          chmod 600 ${{ env.SSH_KEY_PATH }}
          head -n1 ${{ env.SSH_KEY_PATH }} | grep -q "BEGIN.*KEY" || (echo "Invalid key format" && exit 1)

      - name: Back up current .env and upload the new one
        run: |
          SSH_OPTS="-p ${{ env.SSH_PORT }} -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i ${{ env.SSH_KEY_PATH }}"
          TARGET="${{ secrets.PRODUCTION_SSH_USERNAME }}@${{ secrets.PRODUCTION_SSH_HOST }}"

          ssh $SSH_OPTS "$TARGET" "mkdir -p ${{ env.DEPLOY_DIR }} && \
            if [ -f ${{ env.DEPLOY_DIR }}.env ]; then \
              cp -p ${{ env.DEPLOY_DIR }}.env ${{ env.DEPLOY_DIR }}.env.bak.\$(date -u +%Y%m%dT%H%M%SZ) && \
              echo 'Backed up existing .env'; \
            else \
              echo 'No existing .env — creating fresh'; \
            fi"

          scp $SSH_OPTS .env.rendered "$TARGET:${{ env.DEPLOY_DIR }}.env"
          ssh $SSH_OPTS "$TARGET" "chmod 600 ${{ env.DEPLOY_DIR }}.env"

      - name: Validate compose can resolve .env
        run: |
          SSH_OPTS="-p ${{ env.SSH_PORT }} -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i ${{ env.SSH_KEY_PATH }}"
          TARGET="${{ secrets.PRODUCTION_SSH_USERNAME }}@${{ secrets.PRODUCTION_SSH_HOST }}"

          ssh $SSH_OPTS "$TARGET" "cd ${{ env.DEPLOY_DIR }} && \
            if [ -f ${{ env.COMPOSE_FILE }} ]; then \
              docker compose -f ${{ env.COMPOSE_FILE }} config -q && echo 'compose config OK - .env satisfies docker-compose.production.yml'; \
            else \
              echo '::warning::${{ env.COMPOSE_FILE }} is not on the server yet - run the Manual deploy production workflow first; skipping .env validation'; \
            fi"

      - name: Clean up
        if: always()
        run: rm -f ${{ env.SSH_KEY_PATH }} .env.rendered .env.rendered.tmp
