name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  application-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore LF.ApplicationTests/LF.ApplicationTests.csproj

      - name: Build
        run: dotnet build LF.ApplicationTests/LF.ApplicationTests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test LF.ApplicationTests/LF.ApplicationTests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: LF.ApplicationTests results
          path: "**/test-results.trx"
          reporter: dotnet-trx

  webapi-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore LF.WebApiTests/LF.WebApiTests.csproj

      - name: Build
        run: dotnet build LF.WebApiTests/LF.WebApiTests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test LF.WebApiTests/LF.WebApiTests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: LF.WebApiTests results
          path: "**/test-results.trx"
          reporter: dotnet-trx
