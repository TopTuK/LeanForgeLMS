name: Manual deploy production

on: workflow_dispatch

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/toptuk/leanforgelms

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore LeanForgeLMS.slnx

      - name: Build
        run: dotnet build LeanForgeLMS.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test LeanForgeLMS.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend test results
          path: "**/test-results.trx"
          reporter: dotnet-trx

  webapp-tests:
    name: Webapp tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lf.webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: lf.webapp/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Test
        run: npm run test:coverage
        env:
          CI: "true"

      - name: Build
        run: npm run build

  build:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [backend-tests, webapp-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push lf-webapi
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./LF.WebApi/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/webapi:latest
            ${{ env.IMAGE_PREFIX }}/webapi:${{ github.sha }}
          cache-from: type=gha,scope=webapi
          cache-to: type=gha,mode=max,scope=webapi

      - name: Build and push lf-identityservice
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./LF.IdentityService/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/identityservice:latest
            ${{ env.IMAGE_PREFIX }}/identityservice:${{ github.sha }}
          cache-from: type=gha,scope=identityservice
          cache-to: type=gha,mode=max,scope=identityservice

      - name: Build and push lf-courseservice
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./LF.CourseService/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/courseservice:latest
            ${{ env.IMAGE_PREFIX }}/courseservice:${{ github.sha }}
          cache-from: type=gha,scope=courseservice
          cache-to: type=gha,mode=max,scope=courseservice

      - name: Build and push lf-paymentservice
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./LF.PaymentService/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/paymentservice:latest
            ${{ env.IMAGE_PREFIX }}/paymentservice:${{ github.sha }}
          cache-from: type=gha,scope=paymentservice
          cache-to: type=gha,mode=max,scope=paymentservice

  deploy:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: build
    env:
      SSH_KEY_PATH: /tmp/ssh_key
      SSH_PORT: 45654
      DEPLOY_DIR: /home/toptuk/leanforgelms/
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deploy secrets
        run: |
          if [ -z "${{ secrets.PRODUCTION_SSH_USERNAME }}" ]; then
            echo "::error::PRODUCTION_SSH_USERNAME secret is not set or empty (this causes 'runner@host' and Permission denied)"
            exit 1
          fi
          if [ -z "${{ secrets.PRODUCTION_SSH_HOST }}" ]; then
            echo "::error::PRODUCTION_SSH_HOST secret is not set or empty"
            exit 1
          fi
          if [ -z "${{ secrets.PRODUCTION_SSH_KEY }}" ]; then
            echo "::error::PRODUCTION_SSH_KEY secret is not set or empty"
            exit 1
          fi

      - name: Setup SSH key
        run: |
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY }}" | sed 's/\r$//' > ${{ env.SSH_KEY_PATH }}
          chmod 600 ${{ env.SSH_KEY_PATH }}
          head -n1 ${{ env.SSH_KEY_PATH }} | grep -q "BEGIN.*KEY" || (echo "Invalid key format" && exit 1)

      - name: Copy docker-compose to server
        run: |
          ssh -p ${{ env.SSH_PORT }} -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i ${{ env.SSH_KEY_PATH }} \
            ${{ secrets.PRODUCTION_SSH_USERNAME }}@${{ secrets.PRODUCTION_SSH_HOST }} \
            "mkdir -p ${{ env.DEPLOY_DIR }}"
          scp -P ${{ env.SSH_PORT }} -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i ${{ env.SSH_KEY_PATH }} \
            docker-compose.production.yml \
            ${{ secrets.PRODUCTION_SSH_USERNAME }}@${{ secrets.PRODUCTION_SSH_HOST }}:${{ env.DEPLOY_DIR }}

      - name: Deploy on PROD server
        run: |
          ssh -p ${{ env.SSH_PORT }} -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i ${{ env.SSH_KEY_PATH }} \
            ${{ secrets.PRODUCTION_SSH_USERNAME }}@${{ secrets.PRODUCTION_SSH_HOST }} \
            "cd ${{ env.DEPLOY_DIR }} && \
             docker login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.TOKEN }} && \
             docker compose -f docker-compose.production.yml pull && \
             docker compose -f docker-compose.production.yml up -d --no-build --remove-orphans && \
             docker image prune -af"
