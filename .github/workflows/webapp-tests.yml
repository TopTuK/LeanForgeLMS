name: Webapp Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "lf.webapp/**"
      - ".github/workflows/webapp-tests.yml"

jobs:
  webapp-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lf.webapp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: lf.webapp/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      # Runs every src/**/*.spec.js — component, Pinia store (authStore,
      # lessonPartStore) and service (api, profile, admin, course, enrollment,
      # lessonPart) suites — and emits coverage + a JUnit report.
      - name: Test
        run: npm run test:coverage
        env:
          CI: "true"

      - name: Build
        run: npm run build

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: lf.webapp vitest results
          path: "lf.webapp/test-results/junit.xml"
          reporter: jest-junit

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-webapp-coverage
          path: lf.webapp/coverage
          if-no-files-found: ignore
