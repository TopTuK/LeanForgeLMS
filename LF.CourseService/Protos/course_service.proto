syntax = "proto3";

option csharp_namespace = "LF.CourseService";

import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";

package course_service;

// The Course service definition
service CourseServiceRpc {
  // Create a new draft course
  rpc CreateCourse (CreateCourseRequest) returns (CourseDetailReply);
  // Get a course by id, with its chapters and lessons
  rpc GetCourse (GetCourseRequest) returns (CourseDetailReply);
  // List courses, paged; scoped to the acting user's own courses unless they are an admin
  rpc ListCourses (ListCoursesRequest) returns (ListCoursesReply);
  // List available course categories
  rpc ListCategories (ListCategoriesRequest) returns (ListCategoriesReply);
  // Create a new course category (admin only)
  rpc CreateCategory (CreateCategoryRequest) returns (CategoryReply);
  // Delete a course category; the default category and categories still assigned to courses cannot be deleted (admin only)
  rpc DeleteCategory (DeleteCategoryRequest) returns (DeleteCategoryReply);
  // Add a chapter to a course
  rpc AddChapter (AddChapterRequest) returns (CourseDetailReply);
  // Rename a chapter
  rpc RenameChapter (RenameChapterRequest) returns (CourseDetailReply);
  // Move a chapter up or down within its course
  rpc MoveChapter (MoveChapterRequest) returns (CourseDetailReply);
  // Add a lesson to a chapter
  rpc AddLesson (AddLessonRequest) returns (CourseDetailReply);
  // Update a lesson's title/content/preview flag
  rpc UpdateLesson (UpdateLessonRequest) returns (CourseDetailReply);
  // Move a lesson up or down within its chapter
  rpc MoveLesson (MoveLessonRequest) returns (CourseDetailReply);
  // Remove a lesson from its chapter
  rpc RemoveLesson (RemoveLessonRequest) returns (CourseDetailReply);
  // Publish a course (requires at least one chapter, each with at least one lesson)
  rpc PublishCourse (PublishCourseRequest) returns (CourseDetailReply);
  // Replace a lesson's parts (text/image/video/audio blocks) with a new ordered set
  rpc ReplaceLessonParts (ReplaceLessonPartsRequest) returns (CourseDetailReply);
  // Browse published courses the acting user is not yet enrolled in, paged
  rpc ListCatalog (ListCatalogRequest) returns (ListCatalogReply);
  // Enroll the acting user in a published course
  rpc EnrollInCourse (EnrollInCourseRequest) returns (EnrollmentDetailReply);
  // List the acting user's enrollments, optionally filtered by status
  rpc ListMyEnrollments (ListMyEnrollmentsRequest) returns (ListMyEnrollmentsReply);
  // Get one enrollment's full course structure with per-lesson completion
  rpc GetEnrollment (GetEnrollmentRequest) returns (EnrollmentDetailReply);
  // Mark a lesson complete for an enrollment
  rpc CompleteLesson (CompleteLessonRequest) returns (EnrollmentDetailReply);
  // Grade a quiz lesson part submission; a passing attempt completes the lesson
  rpc SubmitQuizAttempt (SubmitQuizAttemptRequest) returns (QuizAttemptResultReply);
  // Resolve a published course's cover image key/content-type for streaming; no ownership check
  // beyond "published", since published courses are already publicly listed in the catalog
  rpc GetCourseCover (GetCourseCoverRequest) returns (CourseCoverReply);
  // Get a published course's full description and preview-flagged lesson content for a
  // not-yet-enrolled student; non-preview lessons come back with no content/parts at all
  rpc GetCoursePreview (GetCoursePreviewRequest) returns (CoursePreviewReply);
}

enum MoveDirection {
  MOVE_DIRECTION_UNKNOWN = 0;
  UP = 1;
  DOWN = 2;
}

enum CourseCoverType {
  COURSE_COVER_TYPE_NONE = 0;
  COURSE_COVER_TYPE_COLOR = 1;
  COURSE_COVER_TYPE_IMAGE = 2;
}

enum CourseCoverColor {
  COURSE_COVER_COLOR_CORAL = 0;
  COURSE_COVER_COLOR_OCEAN = 1;
  COURSE_COVER_COLOR_FOREST = 2;
  COURSE_COVER_COLOR_AMBER = 3;
  COURSE_COVER_COLOR_SLATE = 4;
  COURSE_COVER_COLOR_BERRY = 5;
}

enum LessonPartType {
  LESSON_PART_TYPE_TEXT = 0;
  LESSON_PART_TYPE_IMAGE = 1;
  LESSON_PART_TYPE_VIDEO = 2;
  LESSON_PART_TYPE_AUDIO = 3;
  LESSON_PART_TYPE_QUIZ = 4;
  LESSON_PART_TYPE_FILES = 5;
}

enum QuestionType {
  QUESTION_TYPE_SINGLE_CHOICE = 0;
  QUESTION_TYPE_MULTIPLE_CHOICE = 1;
}

message CreateCourseRequest {
  string title = 1;
  string short_introduction = 2;
  string description = 3;
  int32 category_id = 4;
  int32 created_by_user_id = 5;
  CourseCoverType cover_type = 6;
  CourseCoverColor cover_color = 7;
  google.protobuf.Int32Value cover_image_storage_object_id = 8;
}

message GetCourseRequest {
  int32 id = 1;
  int32 acting_user_id = 2;
  bool acting_is_admin = 3;
}

message ListCoursesRequest {
  int32 page = 1;
  int32 page_size = 2;
  int32 acting_user_id = 3;
  bool acting_is_admin = 4;
}

message ListCoursesReply {
  repeated CourseSummaryReply courses = 1;
  int32 total_count = 2;
}

message CourseSummaryReply {
  int32 id = 1;
  string title = 2;
  string short_introduction = 3;
  bool is_published = 4;
  int32 category_id = 5;
  string category_name = 6;
  int32 created_by_user_id = 7;
  google.protobuf.Timestamp created_at = 8;
  int32 chapter_count = 9;
  CourseCoverType cover_type = 10;
  CourseCoverColor cover_color = 11;
  google.protobuf.StringValue cover_image_key = 12;
  google.protobuf.StringValue cover_image_content_type = 13;
}

message CourseDetailReply {
  int32 id = 1;
  string title = 2;
  string short_introduction = 3;
  string description = 4;
  bool is_published = 6;
  int32 category_id = 7;
  string category_name = 8;
  int32 created_by_user_id = 9;
  google.protobuf.Timestamp created_at = 10;
  repeated ChapterReply chapters = 11;
  CourseCoverType cover_type = 12;
  CourseCoverColor cover_color = 13;
  google.protobuf.StringValue cover_image_key = 14;
  google.protobuf.StringValue cover_image_content_type = 15;
}

message ChapterReply {
  int32 id = 1;
  string title = 2;
  int32 sort_order = 3;
  repeated LessonReply lessons = 4;
}

message LessonReply {
  int32 id = 1;
  string title = 2;
  string content = 3;
  bool include_in_preview = 4;
  int32 sort_order = 5;
  repeated LessonPartReply parts = 6;
}

message LessonPartReply {
  int32 id = 1;
  LessonPartType part_type = 2;
  int32 sort_order = 3;
  google.protobuf.StringValue html = 4;
  google.protobuf.Int32Value storage_object_id = 5;
  google.protobuf.StringValue storage_object_key = 6;
  google.protobuf.StringValue storage_object_content_type = 7;
  repeated QuizQuestionReply quiz_questions = 8;
  google.protobuf.Int32Value quiz_pass_threshold_percent = 9;
  repeated LessonPartFileReply files = 10;
}

message LessonPartInput {
  LessonPartType part_type = 1;
  google.protobuf.StringValue html = 2;
  google.protobuf.Int32Value storage_object_id = 3;
  repeated QuizQuestionInput quiz_questions = 4;
  google.protobuf.Int32Value quiz_pass_threshold_percent = 5;
  repeated LessonPartFileInput files = 6;
}

message LessonPartFileReply {
  int32 id = 1;
  string file_name = 2;
  int32 sort_order = 3;
  int32 storage_object_id = 4;
  string storage_object_key = 5;
  string storage_object_content_type = 6;
  int64 storage_object_size_bytes = 7;
}

message LessonPartFileInput {
  string file_name = 1;
  int32 storage_object_id = 2;
}

message QuizOptionInput {
  string text = 1;
  bool is_correct = 2;
  int32 sort_order = 3;
}

message QuizQuestionInput {
  string text = 1;
  QuestionType question_type = 2;
  int32 sort_order = 3;
  repeated QuizOptionInput options = 4;
}

message QuizOptionReply {
  int32 id = 1;
  string text = 2;
  bool is_correct = 3;
  int32 sort_order = 4;
}

message QuizQuestionReply {
  int32 id = 1;
  string text = 2;
  QuestionType question_type = 3;
  int32 sort_order = 4;
  repeated QuizOptionReply options = 5;
}

message ReplaceLessonPartsRequest {
  int32 course_id = 1;
  int32 chapter_id = 2;
  int32 lesson_id = 3;
  repeated LessonPartInput parts = 4;
  int32 acting_user_id = 5;
  bool acting_is_admin = 6;
}

message ListCategoriesRequest {
}

message ListCategoriesReply {
  repeated CategoryReply categories = 1;
}

message CategoryReply {
  int32 id = 1;
  string name = 2;
  bool is_default = 3;
}

message CreateCategoryRequest {
  string name = 1;
}

message DeleteCategoryRequest {
  int32 id = 1;
}

message DeleteCategoryReply {
  bool deleted = 1;
}

message AddChapterRequest {
  int32 course_id = 1;
  string title = 2;
  int32 acting_user_id = 3;
  bool acting_is_admin = 4;
}

message RenameChapterRequest {
  int32 course_id = 1;
  int32 chapter_id = 2;
  string title = 3;
  int32 acting_user_id = 4;
  bool acting_is_admin = 5;
}

message MoveChapterRequest {
  int32 course_id = 1;
  int32 chapter_id = 2;
  MoveDirection direction = 3;
  int32 acting_user_id = 4;
  bool acting_is_admin = 5;
}

message AddLessonRequest {
  int32 course_id = 1;
  int32 chapter_id = 2;
  string title = 3;
  google.protobuf.StringValue content = 4;
  bool include_in_preview = 5;
  int32 acting_user_id = 6;
  bool acting_is_admin = 7;
}

message UpdateLessonRequest {
  int32 course_id = 1;
  int32 chapter_id = 2;
  int32 lesson_id = 3;
  string title = 4;
  google.protobuf.StringValue content = 5;
  bool include_in_preview = 6;
  int32 acting_user_id = 7;
  bool acting_is_admin = 8;
}

message MoveLessonRequest {
  int32 course_id = 1;
  int32 chapter_id = 2;
  int32 lesson_id = 3;
  MoveDirection direction = 4;
  int32 acting_user_id = 5;
  bool acting_is_admin = 6;
}

message RemoveLessonRequest {
  int32 course_id = 1;
  int32 chapter_id = 2;
  int32 lesson_id = 3;
  int32 acting_user_id = 4;
  bool acting_is_admin = 5;
}

message PublishCourseRequest {
  int32 course_id = 1;
  int32 acting_user_id = 2;
  bool acting_is_admin = 3;
}

enum EnrollmentStatusFilter {
  ENROLLMENT_STATUS_FILTER_ALL = 0;
  ENROLLMENT_STATUS_FILTER_ACTIVE = 1;
  ENROLLMENT_STATUS_FILTER_COMPLETED = 2;
}

message ListCatalogRequest {
  int32 page = 1;
  int32 page_size = 2;
  int32 acting_user_id = 3;
}

message ListCatalogReply {
  repeated CourseCatalogItemReply items = 1;
  int32 total_count = 2;
}

message CourseCatalogItemReply {
  int32 id = 1;
  string title = 2;
  string short_introduction = 3;
  int32 category_id = 4;
  string category_name = 5;
  int32 lesson_count = 6;
  CourseCoverType cover_type = 7;
  CourseCoverColor cover_color = 8;
  google.protobuf.StringValue cover_image_key = 9;
  google.protobuf.StringValue cover_image_content_type = 10;
}

message GetCourseCoverRequest {
  int32 course_id = 1;
}

message CourseCoverReply {
  google.protobuf.StringValue cover_image_key = 1;
  google.protobuf.StringValue cover_image_content_type = 2;
}

message EnrollInCourseRequest {
  int32 course_id = 1;
  int32 acting_user_id = 2;
}

message ListMyEnrollmentsRequest {
  int32 acting_user_id = 1;
  EnrollmentStatusFilter status = 2;
}

message ListMyEnrollmentsReply {
  repeated EnrollmentSummaryReply items = 1;
}

message EnrollmentSummaryReply {
  int32 id = 1;
  int32 course_id = 2;
  string course_title = 3;
  string course_short_introduction = 4;
  string category_name = 5;
  int32 total_lesson_count = 6;
  int32 completed_lesson_count = 7;
  int32 progress_percent = 8;
  google.protobuf.Timestamp enrolled_at = 9;
  google.protobuf.Timestamp completed_at = 10;
  CourseCoverType cover_type = 11;
  CourseCoverColor cover_color = 12;
  google.protobuf.StringValue cover_image_key = 13;
  google.protobuf.StringValue cover_image_content_type = 14;
}

message GetEnrollmentRequest {
  int32 id = 1;
  int32 acting_user_id = 2;
  bool acting_is_admin = 3;
}

message CompleteLessonRequest {
  int32 id = 1;
  int32 lesson_id = 2;
  int32 acting_user_id = 3;
  bool acting_is_admin = 4;
}

message EnrollmentDetailReply {
  int32 id = 1;
  int32 course_id = 2;
  string course_title = 3;
  string course_description = 4;
  google.protobuf.Timestamp enrolled_at = 5;
  google.protobuf.Timestamp completed_at = 6;
  repeated EnrollmentChapterReply chapters = 7;
}

message EnrollmentChapterReply {
  int32 id = 1;
  string title = 2;
  int32 sort_order = 3;
  repeated EnrollmentLessonReply lessons = 4;
}

message EnrollmentLessonReply {
  int32 id = 1;
  string title = 2;
  string content = 3;
  int32 sort_order = 4;
  bool is_completed = 5;
  repeated LessonPartReply parts = 6;
}

message QuizAnswerInput {
  int32 question_id = 1;
  repeated int32 selected_option_ids = 2;
}

message SubmitQuizAttemptRequest {
  int32 id = 1;
  int32 lesson_id = 2;
  int32 part_id = 3;
  repeated QuizAnswerInput answers = 4;
  int32 acting_user_id = 5;
  bool acting_is_admin = 6;
}

message QuizQuestionResultReply {
  int32 question_id = 1;
  bool is_correct = 2;
  repeated int32 correct_option_ids = 3;
}

message QuizAttemptResultReply {
  int32 score_percent = 1;
  bool passed = 2;
  repeated QuizQuestionResultReply questions = 3;
  EnrollmentDetailReply enrollment = 4;
}

message GetCoursePreviewRequest {
  int32 course_id = 1;
  int32 acting_user_id = 2;
}

message CoursePreviewReply {
  int32 id = 1;
  string title = 2;
  string short_introduction = 3;
  string description = 4;
  int32 category_id = 5;
  string category_name = 6;
  int32 lesson_count = 7;
  CourseCoverType cover_type = 8;
  CourseCoverColor cover_color = 9;
  google.protobuf.StringValue cover_image_key = 10;
  google.protobuf.StringValue cover_image_content_type = 11;
  bool is_enrolled = 12;
  google.protobuf.Int32Value enrollment_id = 13;
  repeated CoursePreviewChapterReply chapters = 14;
}

message CoursePreviewChapterReply {
  int32 id = 1;
  string title = 2;
  int32 sort_order = 3;
  repeated CoursePreviewLessonReply lessons = 4;
}

message CoursePreviewLessonReply {
  int32 id = 1;
  string title = 2;
  int32 sort_order = 3;
  bool include_in_preview = 4;
  google.protobuf.StringValue content = 5;
  repeated LessonPartReply parts = 6;
}
