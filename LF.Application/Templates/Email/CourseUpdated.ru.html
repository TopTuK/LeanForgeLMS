<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обновления в курсе «{{CourseTitle}}»</title>
</head>
<body style="margin:0;padding:0;background-color:#f6f4ef;font-family:Arial,Helvetica,sans-serif;color:#2b2a27;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6f4ef;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#ffffff;border-radius:12px;">
          <tr>
            <td style="padding:32px 32px 8px 32px;font-size:18px;font-weight:bold;color:#ec683c;">LeanForge</td>
          </tr>
          <tr>
            <td style="padding:8px 32px 0 32px;">
              <h1 style="margin:0 0 16px 0;font-size:22px;line-height:1.3;color:#2b2a27;">В курсе появились обновления</h1>
              <p style="margin:0 0 12px 0;font-size:15px;line-height:1.6;">Здравствуйте, {{Name}}!</p>
              <p style="margin:0 0 12px 0;font-size:15px;line-height:1.6;">Автор обновил курс <strong>«{{CourseTitle}}»</strong>, на который вы записаны:</p>
              {{{ChangesHtml}}}
            </td>
          </tr>
          <tr>
            <td style="padding:12px 32px 24px 32px;">
              <a href="{{CourseUrl}}" style="display:inline-block;padding:12px 24px;background-color:#ec683c;color:#ffffff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:bold;">Открыть курс</a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 32px 32px;font-size:13px;line-height:1.6;color:#5a5852;">
              Если кнопка не работает, откройте ссылку: <a href="{{CourseUrl}}" style="color:#d4552a;">{{CourseUrl}}</a>
            </td>
          </tr>
        </table>
        <p style="margin:16px 0 0 0;font-size:12px;color:#7a776e;">Письмо отправлено автоматически, отвечать на него не нужно.</p>
      </td>
    </tr>
  </table>
</body>
</html>
