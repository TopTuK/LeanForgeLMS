syntax = "proto3";

option csharp_namespace = "LF.IdentityService";

import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";

package user_service;

// The User service defenition
service UserServiceRpc {
  // Get or create user
  rpc GetOrCreateUser (GetUserRequest) returns (GetUserReply);
  // Get a user's profile by id
  rpc GetUserProfile (GetUserProfileRequest) returns (GetUserReply);
  // Update a user's first/last name
  rpc UpdateUserProfile (UpdateUserProfileRequest) returns (GetUserReply);
  // Update (or clear) a user's avatar object key
  rpc UpdateUserAvatar (UpdateUserAvatarRequest) returns (GetUserReply);
  // Get or create user and force-set the given role (development/testing use only)
  rpc EnsureUserWithRole (EnsureUserWithRoleRequest) returns (GetUserReply);
}

message GetUserRequest {
  string email = 1;
  string first_name = 2;
  google.protobuf.StringValue last_name = 3;
}

// Canonical "full user" reply shape, reused by GetOrCreateUser, GetUserProfile, UpdateUserProfile and UpdateUserAvatar.
message GetUserReply {
  int32 id = 1;
  string email = 2;
  string first_name = 3;
  google.protobuf.StringValue last_name = 4;
  UserRole role = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.StringValue avatar_key = 7;
}

message GetUserProfileRequest {
  int32 id = 1;
}

message UpdateUserProfileRequest {
  int32 id = 1;
  string first_name = 2;
  google.protobuf.StringValue last_name = 3;
}

message UpdateUserAvatarRequest {
  int32 id = 1;
  // Unset (null) clears the avatar, reverting the user to the default image.
  google.protobuf.StringValue avatar_key = 2;
}

message EnsureUserWithRoleRequest {
  string email = 1;
  string first_name = 2;
  google.protobuf.StringValue last_name = 3;
  UserRole role = 4;
}

enum UserRole {
  UNKNOWN = 0;
  STUDENT = 1;
  INSTRUCTOR = 2;
  CREATOR = 3;
  ADMIN = 4;
}